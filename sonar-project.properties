sonar.projectKey=oficina-execution-service
sonar.projectName=Oficina - Execution Service
sonar.projectVersion=1.0

sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/node_modules/**,**/dist/**,**/coverage/**

sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Mesmo recorte que o Jest cobra (collectCoverageFrom): domínio e aplicação.
# Infraestrutura é coberta pelos testes de integração e E2E.
sonar.coverage.exclusions=src/infrastructure/**,src/shared/**,src/*.ts,**/*.module.ts,**/*.interface.ts

sonar.typescript.tsconfigPath=tsconfig.json
sonar.sourceEncoding=UTF-8
