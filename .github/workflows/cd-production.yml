name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Esteira padrão: docs/arquitetura/esteira-ci-cd.md (oficina-backend).
env:
  AWS_REGION: sa-east-1
  K3S_NODE_TAG: oficina-backend-k3s-node
  ECR_REPOSITORY: oficina-execution-service
  K8S_NAMESPACE: execution
  DEPLOYMENT_NAME: oficina-execution-service

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Só push na main deste repositório: um PR de fork com branch "main" não pode disparar o deploy.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the k3s node
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${K3S_NODE_TAG}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "::error::No running k3s instance found (tag Name=${K3S_NODE_TAG}). Run 'terraform apply' in /infra first."
            exit 1
          fi

          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)

          echo "Found $INSTANCE_ID at $PUBLIC_IP"
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"

      - name: Fetch kubeconfig via SSM
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cat /etc/rancher/k3s/k3s.yaml"]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text \
            | sed "s/127.0.0.1/${PUBLIC_IP}/" > "${RUNNER_TEMP}/kubeconfig.yaml"

          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Build and push image to ECR
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URL="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          IMAGE="${ECR_URL}:${{ github.sha }}"

          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_URL"
          docker build -t "$IMAGE" -t "${ECR_URL}:latest" .
          docker push "$IMAGE"
          docker push "${ECR_URL}:latest"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: 'latest'

      - name: Check secrets applied by hand
        run: |
          kubectl get secret mongodb-credentials oficina-execution-service-secret -n "${K8S_NAMESPACE}" > /dev/null || {
            echo "::error::Aplique k8s/mongodb-credentials.yaml e k8s/secret.yaml antes do deploy (ver k8s/README.md)."
            exit 1
          }

      - name: Deploy MongoDB
        run: |
          set -euo pipefail
          kubectl apply -f k8s/mongodb.yaml
          kubectl rollout status statefulset/mongodb -n "${K8S_NAMESPACE}" --timeout=240s

      - name: Deploy application manifests
        run: |
          set -euo pipefail
          kubectl apply -f k8s/configmap.yaml
          sed "s#REPLACE_WITH_ECR_IMAGE_URI:latest#${IMAGE}#" k8s/deployment.yaml | kubectl apply -f -
          for f in service ingress hpa; do
            if [ -f "k8s/${f}.yaml" ]; then kubectl apply -f "k8s/${f}.yaml"; fi
          done
          kubectl rollout status "deployment/${DEPLOYMENT_NAME}" -n "${K8S_NAMESPACE}" --timeout=180s
