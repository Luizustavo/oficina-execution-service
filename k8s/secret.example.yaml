# Modelo: copie para secret.yaml (ignorado pelo git) e preencha. Ver k8s/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-execution-service-secret
  namespace: execution
type: Opaque
stringData:
  # O mesmo JWT_SECRET do oficina-backend e da Lambda de CPF.
  JWT_SECRET: "same-secret-as-the-lambda"
  # Senha igual à executionPassword do mongodb-credentials.yaml.
  MONGODB_URL: "mongodb://execution_user:senha-forte-so-letras-e-numeros@mongodb.execution.svc.cluster.local:27017/execution_db?authSource=execution_db"
  RABBITMQ_URL: "amqp://oficina:password@rabbitmq.messaging.svc.cluster.local:5672/oficina"
  NEW_RELIC_LICENSE_KEY: "your_new_relic_ingest_license_key"
