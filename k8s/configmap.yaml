apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-execution-service-config
  namespace: execution
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "oficina-execution-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://otlp.nr-data.net"
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "delta"
