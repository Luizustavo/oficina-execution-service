apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina-execution-service
  namespace: execution
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/execution
            pathType: Prefix
            backend:
              service:
                name: oficina-execution-service
                port:
                  number: 80
