# MongoDB do Execution (dono único, ADR-012). Sem replica set: o outbox fica dentro do documento do job.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: execution
data:
  # Roda só no primeiro boot (volume vazio), autenticado como root.
  01-execution-user.js: |
    const password = process.env.EXECUTION_DB_PASSWORD;
    if (!password) {
      throw new Error('EXECUTION_DB_PASSWORD não definido');
    }
    db.getSiblingDB('execution_db').createUser({
      user: 'execution_user',
      pwd: password,
      roles: [{ role: 'readWrite', db: 'execution_db' }],
    });
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: execution
  labels:
    app: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: mongo:8.0
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: rootUsername
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: rootPassword
            - name: EXECUTION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: executionPassword
          ports:
            - name: mongodb
              containerPort: 27017
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 32Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # No primeiro boot o entrypoint sobe um mongod só em localhost para rodar o init e depois reinicia.
          startupProbe:
            tcpSocket:
              port: mongodb
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: mongodb
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongodb
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: init
          configMap:
            name: mongodb-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: execution
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
